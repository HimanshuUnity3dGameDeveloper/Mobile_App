<ion-content [fullscreen]="true">

  <swiper-container direction="vertical" slides-per-view="1" space-between="0" (swiperslidechange)="onSlideChange($event)" class="reels-swiper">
    <swiper-slide *ngFor="let reel of reels; let i = index">
      <!-- 1. Background YouTube Video (Scales to cover 100vh) -->
      <div class="video-wrapper">
        <video
          #videoPlayer
          [src]="reel.mediaUrl"
          (ended)="onVideoEnded(i)"
          playsinline
          [autoplay]="i === 0"
          (click)="togglePlayPause(i)"
          (loadedmetadata)="onLoadedMetadata($event, reel)"
          (play)="audioPlayer.play()"
          (pause)="audioPlayer.pause()">
        </video>
        <audio 
          #audioPlayer 
          [src]="reel.audio?.audioUrl">
        </audio>
        @if (reel.duration) {
          <span class="video-duration">{{ reel.duration }}</span>
        }
      </div>

      <!-- 2. Instagram Right-Side Action Controls -->
      <div class="side-actions">
        <div class="action-btn">
          <ion-icon 
            [name]="isLikedByCurrentUser(reel?.likedBy) ? 'heart' : 'heart-outline'" 
            [class.active]="isLikedByCurrentUser(reel?.likedBy)"
            (click)="toggleLike(reel)"></ion-icon>
          <span>{{ reel.likesCount }}</span>
        </div>

        <div class="action-btn">
          <ion-icon name="chatbubble-outline"></ion-icon>
          <span>{{reel.commentsCount}}</span>
        </div>

        <div class="action-btn">
          <ion-icon name="paper-plane-outline"></ion-icon>
          <span>{{ reel.sharesCount }}</span>
        </div>

        <div class="action-btn">
          <ion-icon name="ellipsis-vertical-outline"></ion-icon>
        </div>
      </div>

      <!-- 3. Bottom Information Overlay (User, Sound, Caption) -->
      <div class="bottom-info">
        <div class="user-row">
          <div class="user-profile">
            <ion-avatar class="avatar-img">           
              <ion-img [src]="reel?.author?.avatarUrl" alt="User Avatar"></ion-img>
            </ion-avatar>
            <div class="user-title">
              <strong>{{ reel?.author?.authorName }}</strong>
              <div class="audio-track">
                <ion-icon name="musical-notes"></ion-icon>
                <span>{{ reel?.audio?.artist }}</span>
              </div>
            </div>
          </div>        
          <ion-button size="small" fill="outline" color="light">Follow</ion-button>
        </div>
        <p class="description">{{ reel?.caption }}</p>
      </div>
    </swiper-slide>
  </swiper-container>
</ion-content>
